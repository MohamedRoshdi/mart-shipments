<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a1c">
  <title>شحنات المحل</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header class="appbar">
    <button id="btn-back" class="icon-btn btn-back" hidden aria-label="رجوع">→</button>
    <h1 id="screen-title">شحنات المحل</h1>
    <button id="who" class="who" hidden></button>
    <span id="sync-state" class="sync"></span>
  </header>

  <main>
    <section id="screen-name" hidden>
      <h2>الموظف</h2>
      <input id="employee-name" type="text" maxlength="50" placeholder="اكتب اسمك">
      <h2>الفرع</h2>
      <div id="branch-picker" class="seg"></div>
      <h2>الرقم السري للفرع</h2>
      <input id="branch-pin" type="password" inputmode="numeric" maxlength="8" dir="ltr" placeholder="••••">
      <button id="save-name" class="primary big">حفظ</button>
    </section>

    <section id="screen-home" hidden>
      <ul id="my-shipments"></ul>
      <div class="bottombar">
        <button id="btn-new" class="primary big">+ شحنة جديدة</button>
      </div>
    </section>

    <section id="screen-new" hidden>
      <h2>الفرع</h2>
      <p id="new-branch" class="branch-line"></p>
      <h2>نوع الشحنة</h2>
      <div id="type-picker" class="seg"></div>
      <h2>اسم الشحنة</h2>
      <input id="shipment-name" type="text" maxlength="100" placeholder="مثلاً: شحنة المراعي">
      <button id="btn-scan" class="scan">امسح الباركود بالكاميرا</button>
      <div id="reader" hidden></div>
      <div class="manual">
        <input id="barcode-input" type="text" inputmode="numeric" maxlength="32" placeholder="أو اكتب الباركود" dir="ltr">
        <button id="btn-lookup" class="ghost">بحث</button>
      </div>
      <h2>الأصناف</h2>
      <ul id="items-list"></ul>
      <div class="bottombar">
        <span id="items-count" class="count"></span>
        <button id="btn-save-shipment" class="primary grow" disabled>حفظ الشحنة</button>
      </div>
    </section>
  </main>

  <div id="scrim" hidden></div>
  <div id="item-form" class="sheet" hidden>
    <div class="handle"></div>
    <p id="item-name" class="item-label"></p>
    <p class="meta">الباركود <span id="item-barcode" class="code"></span></p>
    <div class="qty-row">
      <button id="qty-minus" aria-label="كمية أقل">−</button>
      <input id="item-qty" type="number" value="1" min="1" dir="ltr" aria-label="الكمية">
      <button id="qty-plus" aria-label="كمية أكتر">+</button>
    </div>
    <button id="btn-add-item" class="primary big">إضافة الصنف</button>
    <button id="btn-cancel-item" class="link">إلغاء</button>
  </div>

  <div id="toast"></div>
  <script src="firebase-config.js"></script>
  <script src="vendor/html5-qrcode.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
