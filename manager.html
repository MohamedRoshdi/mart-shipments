<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171a1c">
  <title>شحنات المحل — المدير</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest-manager.json">
</head>
<body>
  <header class="appbar">
    <button id="btn-back" class="icon-btn" hidden aria-label="رجوع">→</button>
    <h1 id="screen-title">شاشة المدير</h1>
    <span id="sync-state" class="sync"></span>
  </header>

  <main>
    <section id="screen-pin" hidden>
      <h2>الرقم السري</h2>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="4" dir="ltr" placeholder="••••">
      <button id="btn-pin" class="primary big">دخول</button>
    </section>

    <section id="screen-manager" hidden>
      <h2>الفرع</h2>
      <div id="branch-filter" class="seg"></div>
      <h2>الشحنات</h2>
      <ul id="all-shipments"></ul>

      <h2>أدوات</h2>
      <ul>
        <li>
          <div class="card-main">
            <div class="card-title">أسماء الأصناف</div>
            <div class="meta">استورد ملف Excel/CSV مرة واحدة، والأسماء تظهر لوحدها مع كل مسح</div>
          </div>
          <div class="row-actions">
            <button id="btn-products" class="primary">عرض الأصناف</button>
            <button id="btn-import">استيراد ملف</button>
            <a id="btn-template" href="products-template.csv" download>تحميل النموذج</a>
          </div>
          <input id="import-file" type="file" accept=".csv,text/csv" hidden>
        </li>
        <li>
          <div class="card-main">
            <div class="card-title">تصدير الشحنات</div>
            <div class="meta">كل الشحنات الظاهرة في ملف واحد يفتح في Excel</div>
          </div>
          <div class="row-actions">
            <button id="btn-export-all">Excel</button>
            <button id="btn-export-all-txt">TXT</button>
          </div>
        </li>
      </ul>
    </section>

    <section id="screen-products" hidden>
      <input id="product-search" type="text" maxlength="60" placeholder="ابحث باسم الصنف أو الباركود">
      <p id="products-count" class="meta"></p>
      <ul id="products-list"></ul>
      <div class="row-actions">
        <button id="btn-export-products">تحميل ملف الأصناف</button>
      </div>
      <div class="bottombar">
        <span id="products-dirty" class="count"></span>
        <button id="btn-save-products" class="primary grow" disabled>حفظ تعديل الأسماء</button>
      </div>
    </section>

    <section id="screen-detail" hidden>
      <h2>اسم الشحنة</h2>
      <input id="detail-name" type="text" maxlength="100">
      <p id="detail-meta" class="meta"></p>
      <h2>الأصناف</h2>
      <table><tbody id="detail-items"></tbody></table>
      <div class="row-actions">
        <button id="btn-copy">نسخ</button>
        <button id="btn-download">Excel</button>
        <button id="btn-download-txt">TXT</button>
      </div>
      <div class="bottombar">
        <button id="btn-save-edit" class="primary big">حفظ التعديلات</button>
      </div>
    </section>
  </main>

  <div id="toast"></div>
  <script src="firebase-config.js"></script>
  <script type="module" src="manager.js"></script>
</body>
</html>
